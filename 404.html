<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Command Link Severed</title>
    <style>
        :root {
            --bg-dark: #0d1117;
            --panel-dark: #161b22;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent-red: #ff7b72;
            --accent-blue: #58a6ff;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            margin: 0; 
            background-color: var(--bg-dark); 
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .error-container {
            text-align: center;
            background: var(--panel-dark);
            padding: 40px 60px;
            border-radius: 24px;
            border: 1px solid var(--border-color);
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
            max-width: 500px;
        }

        .error-icon {
            font-size: 4em;
            margin-bottom: 16px;
            animation: pulse 2s infinite;
        }

        h1 {
            color: var(--accent-red);
            margin: 0 0 10px 0;
            font-size: 2.2em;
            letter-spacing: 1px;
        }

        p {
            color: var(--text-muted);
            font-size: 1.05em;
            line-height: 1.6;
            margin: 0 0 30px 0;
        }

        .return-btn {
            display: inline-block;
            background: #21262d;
            border: 1px solid var(--border-color);
            color: var(--accent-blue);
            padding: 12px 28px;
            border-radius: 12px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .return-btn:hover {
            background: var(--accent-blue);
            color: #0d1117;
            transform: translateY(-2px);
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="error-container">
        <div class="error-icon">⚠️</div>
        <h1>404: Link Broken</h1>
        <p>The location matrix path you dispatched does not map to any local Dex core system functions.</p>
        <a href="/" class="return-btn">Return to Command Matrix</a>
    </div>

</body>
</html>
