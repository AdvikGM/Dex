<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dex Core Neural Network</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        :root {
            --bg-dark: #070a0e; --panel-dark: #0d1117; --border-color: #21262d;
            --text-main: #c9d1d9; --text-muted: #6e7681; --accent-blue: #58a6ff;
            --accent-green: #3fb950; --user-bubble: #1f242c; --border-radius: 12px;
            --dex-bubble: #161b22; --sidebar-width: 300px;
            --glow-effect: 0 0 10px rgba(88, 166, 255, 0.2);
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; background-color: var(--bg-dark); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        .sidebar { 
            width: var(--sidebar-width); background: rgba(9, 13, 19, 0.9); backdrop-filter: blur(15px); border-right: 1px solid var(--border-color); 
            padding: 24px; display: flex; flex-direction: column; gap: 18px; position: fixed; top: 0; left: 0; bottom: 0; z-index: 200;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); box-sizing: border-box;
        }
        .sidebar.hidden { transform: translateX(-100%); }

        .menu-toggle-btn, .kebab-btn {
            background: #161b22; border: 1px solid var(--border-color); color: var(--text-main);
            font-size: 1.2rem; cursor: pointer; width: 40px; height: 40px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center; transition: all 0.2s;
        }
        .menu-toggle-btn:hover, .kebab-btn:hover { border-color: var(--accent-blue); box-shadow: var(--glow-effect); }

        .auth-container { background: #161b22; border: 1px solid var(--border-color); border-radius: 10px; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .auth-input { background: #0d1117; border: 1px solid var(--border-color); color: white; padding: 10px; border-radius: 6px; outline: none; font-size: 0.85em; }
        .auth-btn { background: var(--accent-blue); border: none; color: #0d1117; padding: 10px; border-radius: 6px; font-weight: 700; cursor: pointer; }
        
        /* 🔒 PROFILE STATE MANAGEMENT PANELS */
        .profile-status-card { display: none; background: rgba(63, 185, 80, 0.1); border: 1px solid var(--accent-green); padding: 12px; border-radius: 8px; text-align: center; }

        .chat-area { flex: 1; display: flex; flex-direction: column; background: #0d1117; height: 100%; position: relative; width: 100%; }
        .chat-header-bar { padding: 15px 30px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); }
        .header-left { display: flex; align-items: center; gap: 15px; position: relative; }

        .settings-dropdown-panel {
            display: none; position: absolute; top: 55px; left: 55px; background: rgba(22, 27, 34, 0.95); backdrop-filter: blur(10px);
            border: 1px solid var(--border-color); width: 280px; border-radius: 10px; padding: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6); z-index: 1000; flex-direction: column; gap: 12px;
        }
        .settings-dropdown-panel.active { display: flex; }
        .settings-group { display: flex; flex-direction: column; gap: 6px; }
        .settings-label { font-size: 0.72em; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .form-select, .form-input { background: #0d1117; border: 1px solid var(--border-color); color: white; padding: 8px; border-radius: 6px; font-size: 0.85em; outline: none; width: 100%; box-sizing: border-box; }

        .chat-box { flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; }
        .message { padding: 12px 18px; border-radius: var(--border-radius); max-width: 75%; font-size: 0.95em; line-height: 1.5; animation: fadeInUp 0.3s ease-out; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .user-msg { background-color: var(--user-bubble); align-self: flex-end; border: 1px solid var(--border-color); }
        .dex-msg { background-color: var(--dex-bubble); align-self: flex-start; border: 1px solid rgba(88, 166, 255, 0.1); }
        
        /* 🖼️ HIGH RESOLUTION DYNAMIC IMAGE VIEW OVERRIDES */
        .chat-img-render { max-width: 100%; width: auto; max-height: 380px; border-radius: 8px; margin-top: 10px; border: 1px solid var(--border-color); display: block; object-fit: contain; cursor: zoom-in; transition: transform 0.2s; }
        .chat-img-render:hover { transform: scale(1.02); }

        .input-container { padding: 20px 40px; }
        .input-bar-wrapper { background: #161b22; border-radius: 12px; padding: 10px 20px; border: 1px solid var(--border-color); display: flex; align-items: center; gap: 10px; }
        .input-bar-wrapper input { flex: 1; border: none; background: transparent; outline: none; color: white; font-size: 1em; }
        .exec-btn { background: var(--accent-blue); border: none; color: #0d1117; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 700; }
        
        .fact-vault-frame { background: rgba(22, 27, 34, 0.5); padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); max-height: 150px; overflow-y: auto; }
        .fact-bullet { font-size: 0.8em; color: var(--accent-green); margin-bottom: 5px; }

        .preview-pane { display: none; align-items: center; gap: 12px; background: #0d1117; padding: 8px; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 5px; width: fit-content; }
        .preview-pane img { height: 40px; border-radius: 4px; }

        /* Switch styling */
        .switch { position: relative; display: inline-block; width: 34px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #21262d; transition: .3s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent-blue); }
        input:checked + .slider:before { transform: translateX(14px); }
    </style>
</head>
<body>

    <div class="sidebar hidden" id="mainSidebar">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3 id="panelUserBadge">Guest Core</h3>
            <button class="menu-toggle-btn" onclick="toggleSidebar()">✕</button>
        </div>

        <!-- 🔒 DYNAMIC AUTOCLEAR GATEWAY SYSTEM PANELS -->
        <div class="auth-container" id="authBoxContainer">
            <input type="text" class="auth-input" id="authUsername" placeholder="Username...">
            <input type="password" class="auth-input" id="authPassword" placeholder="Password...">
            <div style="display: flex; gap: 5px;">
                <button class="auth-btn" style="flex: 1;" onclick="executeSystemLogin()">Login</button>
                <button class="auth-btn" style="flex: 1; background: transparent; color: white; border: 1px solid var(--border-color);" onclick="executeSystemSignup()">Sign Up</button>
            </div>
        </div>
        
        <div class="profile-status-card" id="profileBadgeNode">
            <span style="font-size:0.8em; font-weight:700; color:var(--accent-green);">● SYSTEM SESSION VERIFIED</span>
            <div id="lblActiveIdentity" style="font-size:0.95em; margin-top:5px; font-weight:600;"></div>
            <button class="auth-btn" style="background:transparent; color:red; border:1px solid red; font-size:0.75em; padding:4px; margin-top:8px; width:100%;" onclick="executeSystemLogout()">Disconnect</button>
        </div>

        <div style="margin-top: 20px;">
            <p style="font-size: 0.7em; text-transform: uppercase; color: var(--text-muted); font-weight: 700;" id="lblVault">🧠 Permanent Vault</p>
            <div class="fact-vault-frame" id="factSheetPane"></div>
        </div>

        <div style="margin-top: auto; padding-top: 15px; border-top: 1px solid var(--border-color);">
            <div style="display: flex; justify-content: space-between; font-size: 0.85em; margin-bottom: 10px;">
                <span id="lblVoice">Voice Feedback</span>
                <label class="switch"><input type="checkbox" id="voiceOutputToggle"><span class="slider"></span></label>
            </div>
            
            <!-- 🔊 SYNCHRONIZED COMPREHENSIVE TEXT TO SPEECH DIALECT MATRIX DROPDOWN -->
            <div class="settings-group">
                <span class="settings-label" style="font-size:0.65em;" id="lblVoiceEngine">Target Voice Language Accent</span>
                <select id="voiceEngineDropdown" class="form-select" style="font-size:0.8em;"></select>
            </div>
        </div>
    </div>

    <div class="chat-area">
        <div class="chat-header-bar">
            <div class="header-left">
                <button class="menu-toggle-btn" onclick="toggleSidebar()">☰</button>
                <button class="kebab-btn" onclick="toggleSettingsMenu()">⋮</button>
                
                <div class="settings-dropdown-panel" id="settingsMenuDropdown">
                    <div class="settings-group"><span class="settings-label" id="lblProp1">Profile Identity</span><input type="text" id="cfgDisplayName" class="form-input"></div>
                    <div class="settings-group"><span class="settings-label" id="lblProp2">Avatar Emoji</span><select id="cfgAvatar" class="form-select"><option value="🚀">🚀 Spaceship</option><option value="🤖">🤖 Cyborg</option></select></div>
                    <div class="settings-group"><span class="settings-label" id="lblProp3">Workspace Theme</span><select id="cfgTheme" class="form-select" onchange="applyLiveThemeSettings()"><option value="github-dark">Midnight Dark</option><option value="matrix-green">Matrix Terminal</option></select></div>
                    <div class="settings-group"><span class="settings-label" id="lblProp4">System Language</span><select id="cfgLanguage" class="form-select" onchange="triggerFrontendTranslation()"></select></div>
                    <button class="auth-btn" style="background: var(--accent-green); color: white; margin-top: 8px; padding: 10px;" onclick="saveActiveSettingsConfig()">Apply Changes</button>
                </div>

                <select id="modelSelect" style="background: #161b22; color: white; border: 1px solid var(--border-color); padding: 8px 15px; border-radius: 20px; font-size: 0.85em;">
                    <option value="gemini-2.5-flash">🚀 Dex Speed</option>
                    <option value="gemini-2.5-pro">🧠 Dex Brain</option>
                </select>
            </div>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="message dex-msg" id="lblWelcome">⚡ <b>Workspace Core Online.</b> Type <code>generate image: description</code> to trigger Pollinations AI.</div>
        </div>

        <div class="input-container">
            <div class="preview-pane" id="imgPreviewFrame"><img id="previewThumbnail" src=""><span onclick="clearImageAttachment()" style="cursor:pointer; color:red; font-size:0.8em; margin-left:10px;">✕ Remove</span></div>
            <div class="input-bar-wrapper">
                <input type="file" id="imageFileInput" accept="image/*" style="display: none;" onchange="processFileSelection()">
                <button onclick="document.getElementById('imageFileInput').click()" style="background:none; border:none; cursor:pointer; font-size:1.2em; color: white;">📎</button>
                <button id="micButton" onclick="toggleVoiceListening()" style="background:none; border:none; cursor:pointer; font-size:1.2em; color: var(--text-muted);">🎙️</button>
                <input type="text" id="userText" placeholder="Type a message...">
                <button class="exec-btn" id="btnSubmitAction" onclick="sendToDex()">Execute</button>
            </div>
        </div>
    </div>

    <script>
        let promptCount = 0;
        let isAuthenticated = false;
        let localSpeechVoices = [];
        let activeBase64Image = null;
        let speechRecognitionActive = false;
        let speechRecognizer = null;

        // 🌐 COMPREHENSIVE REGIONAL DICTIONARY ENGINE TRANSLATIONS MAP
        const dictionaryMatrix = {
            "en": { "vault": "🧠 Permanent Vault", "voice": "Voice Feedback", "welcome": "Workspace Core Online.", "prop1": "Profile Identity", "prop3": "Workspace Theme", "block": "You need to sign in to continue!" },
            "es-ES": { "vault": "🧠 Bóveda Permanente", "voice": "Voz de Retorno", "welcome": "Núcleo del Sistema Activo.", "prop1": "Identidad de Perfil", "prop3": "Tema de Pantalla", "block": "¡Necesitas iniciar sesión para continuar!" },
            "es-MX": { "vault": "🧠 Bóveda de Datos", "voice": "Retroalimentación de Voz", "welcome": "Línea del Espacio de Trabalho Conectada.", "prop1": "Identidad del Usuario", "prop3": "Estilo Visual", "block": "Inicie sesión para continuar." },
            "fr-FR": { "vault": "🧠 Coffre Permanent", "voice": "Retour Vocal", "welcome": "Noyau Système En Ligne.", "prop1": "Identité du Profil", "prop3": "Thème de Espace", "block": "Vous devez vous connecter pour continuer!" },
            "de-DE": { "vault": "🧠 Permanenter Tresor", "voice": "Sprachrückmeldung", "welcome": "Systemkern Aktiviert.", "prop1": "Profil-Identität", "prop3": "Arbeitsbereich-Thomas", "block": "Sie müssen sich anmelden, um fortzufahren!" },
            "hi-IN": { "vault": "🧠 स्थायी तिजोरी", "voice": "आवाज प्रतिक्रिया", "welcome": "कार्यक्षेत्र कोर ऑनलाइन।", "prop1": "प्रोफ़ाइल पहचान", "prop3": "थीम शैली", "block": "जारी रखने के लिए आपको लॉग इन करना होगा!" },
            "kn-IN": { "vault": "🧠 ಶಾಶ್ವತ ವಾಲ್ಟ್", "voice": "ಧ್ವನಿ ಪ್ರತಿಕ್ರಿಯೆ", "welcome": "ಕಾರ್ಯಕ್ಷೇತ್ರ ಕೋರ್ ಆನ್‌ಲೈನ್.", "prop1": "ಪ್ರೊಫೈಲ್ ಗುರುತು", "prop3": "ಥೀಮ್ ಶೈಲಿ", "block": "ಮುಂದುವರೆಯಲು ನೀವು ಸೈನ್ ಇನ್ ಮಾಡಬೇಕು!" }
        };

        function toggleSidebar() { document.getElementById('mainSidebar').classList.toggle('hidden'); }
        function toggleSettingsMenu() { document.getElementById('settingsMenuDropdown').classList.toggle('active'); }
        document.getElementById("userText").onkeypress = (e) => { if(e.key === 'Enter') sendToDex(); };

        function initializeSessionState() {
            updateSidebarLogs();
            if (typeof speechSynthesis !== 'undefined' && speechSynthesis.onvoiceschanged !== undefined) {
                speechSynthesis.onvoiceschanged = loadVoices;
            }
            loadVoices();
            initializeSpeechToTextEngine();
            
            fetch('/settings/get').then(r => r.json()).then(data => {
                var langSelect = document.getElementById("cfgLanguage"); langSelect.innerHTML = "";
                Object.keys(data.available_languages).forEach(key => { langSelect.innerHTML += `<option value="${key}">${data.available_languages[key]}</option>`; });
                
                document.getElementById("cfgDisplayName").value = data.current_config.account_display_name || "Guest Operator";
                document.getElementById("cfgAvatar").value = data.current_config.avatar_emoji || "🚀";
                document.getElementById("cfgTheme").value = data.current_config.selected_theme || "github-dark";
                document.getElementById("cfgLanguage").value = data.current_config.selected_language || "en";
                applyLiveThemeSettings();
                triggerFrontendTranslation();
            });
        }

        /* 🌐 LIVE FRONTEND DATA TRANSLATION MATRIX ENGINE METHOD */
        function triggerFrontendTranslation() {
            const chosenLang = document.getElementById("cfgLanguage").value || "en";
            const basePrefix = chosenLang.split('-')[0];
            const lexicon = dictionaryMatrix[chosenLang] || dictionaryMatrix[basePrefix] || dictionaryMatrix["en"];
            
            document.getElementById("lblVault").innerText = lexicon.vault;
            document.getElementById("lblVoice").innerText = lexicon.voice;
            document.getElementById("lblWelcome").innerHTML = `⚡ <b>${lexicon.welcome}</b>`;
            document.getElementById("lblProp1").innerText = lexicon.prop1;
            document.getElementById("lblProp3").innerText = lexicon.prop3;
            
            // Re-fire speech synthesizer to auto-align accent language codes dynamically
            syncVoiceEngineDropdownWithLanguageSelection(chosenLang);
        }

        function syncVoiceEngineDropdownWithLanguageSelection(langCode) {
            if(!localSpeechVoices.length) return;
            const target = langCode.toLowerCase().replace('_', '-');
            for(let i=0; i < localSpeechVoices.length; i++) {
                if(localSpeechVoices[i].lang.toLowerCase().startsWith(target.split('-')[0])) {
                    document.getElementById("voiceEngineDropdown").value = i;
                    break;
                }
            }
        }

        function updateSidebarLogs() {
            fetch('/history').then(r => r.json()).then(data => {
                isAuthenticated = data.authenticated;
                if (isAuthenticated) {
                    // Hide the login boxes completely and illuminate session container status parameters
                    document.getElementById("authBoxContainer").style.display = "none";
                    document.getElementById("profileBadgeNode").style.display = "block";
                    document.getElementById("lblActiveIdentity").innerText = "@" + data.username;
                    document.getElementById("panelUserBadge").innerText = data.username;
                } else {
                    document.getElementById("authBoxContainer").style.display = "flex";
                    document.getElementById("profileBadgeNode").style.display = "none";
                    document.getElementById("panelUserBadge").innerText = "Guest Operator";
                }
                if (data.facts_vault) {
                    document.getElementById("factSheetPane").innerHTML = data.facts_vault.map(f => `<div class="fact-bullet">🛡️ ${f}</div>`).join('');
                }
            });
        }

        function executeSystemLogin() {
            const u = document.getElementById("authUsername").value.trim();
            const p = document.getElementById("authPassword").value.trim();
            fetch('/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({username: u, password: p}) })
            .then(r => r.json()).then(data => { if(data.status === "success") window.location.reload(); else alert(data.message); });
        }

        function executeSystemLogout() {
            fetch('/logout', { method: 'POST' }).then(r => r.json()).then(() => window.location.reload());
        }

        function executeSystemSignup() {
            const u = document.getElementById("authUsername").value.trim();
            const p = document.getElementById("authPassword").value.trim();
            const email = prompt("Enter email for registration:");
            if(!email) return alert("Email is mandatory!");
            fetch('/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({username: u, password: p, email: email}) })
            .then(r => r.json()).then(data => alert(data.message));
        }

        function saveActiveSettingsConfig() {
            const chosenName = document.getElementById("cfgDisplayName").value.trim();
            var payload = { 
                "account_display_name": chosenName, 
                "avatar_emoji": document.getElementById("cfgAvatar").value, 
                "selected_theme": document.getElementById("cfgTheme").value, 
                "selected_language": document.getElementById("cfgLanguage").value 
            };
            fetch('/settings/update', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }).then(r => r.json()).then(data => { 
                if(data.status === "success") {
                    document.getElementById("panelUserBadge").innerText = chosenName;
                    triggerFrontendTranslation();
                    toggleSettingsMenu(); 
                }
            });
        }

        function applyLiveThemeSettings() {
            var theme = document.getElementById("cfgTheme").value;
            if(theme === "matrix-green") {
                document.documentElement.style.setProperty('--bg-dark', '#000000'); document.documentElement.style.setProperty('--panel-dark', '#050c05'); document.documentElement.style.setProperty('--border-color', '#00ff00'); document.documentElement.style.setProperty('--text-main', '#33ff33'); document.documentElement.style.setProperty('--accent-blue', '#00ff00');
            } else {
                document.documentElement.style.setProperty('--bg-dark', '#070a0e'); document.documentElement.style.setProperty('--panel-dark', '#0d1117'); document.documentElement.style.setProperty('--border-color', '#21262d'); document.documentElement.style.setProperty('--text-main', '#c9d1d9'); document.documentElement.style.setProperty('--accent-blue', '#58a6ff');
            }
        }

        function processFileSelection() {
            var file = document.getElementById("imageFileInput").files[0];
            var reader = new FileReader();
            reader.onload = function(e) { activeBase64Image = e.target.result; document.getElementById("imgPreviewFrame").style.display = "flex"; document.getElementById("previewThumbnail").src = e.target.result; };
            reader.readAsDataURL(file);
        }
        function clearImageAttachment() { activeBase64Image = null; document.getElementById("imgPreviewFrame").style.display = "none"; document.getElementById("imageFileInput").value = ""; }

        function initializeSpeechToTextEngine() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                var SpeechRecognitionClass = window.SpeechRecognition || window.webkitSpeechRecognition;
                speechRecognizer = new SpeechRecognitionClass(); speechRecognizer.continuous = false; speechRecognizer.interimResults = false; speechRecognizer.lang = 'en-US';
                speechRecognizer.onstart = function() { speechRecognitionActive = true; document.getElementById("micButton").style.color = "#ff7b72"; };
                speechRecognizer.onresult = function(e) { document.getElementById("userText").value = e.results[0][0].transcript; };
                speechRecognizer.onerror = speechRecognizer.onend = function() { speechRecognitionActive = false; document.getElementById("micButton").style.color = "var(--text-muted)"; };
            }
        }
        function toggleVoiceListening() { if (!speechRecognizer) return alert("Speech API not supported."); if (speechRecognitionActive) speechRecognizer.stop(); else speechRecognizer.start(); }

        function sendToDex() {
            const inputField = document.getElementById("userText");
            const text = inputField.value.trim();
            if (!text && !activeBase64Image) return;

            if (!isAuthenticated) {
                promptCount++;
                if (promptCount > 10) {
                    const chosenLang = document.getElementById("cfgLanguage").value || "en";
                    const basePrefix = chosenLang.split('-')[0];
                    const blockMsg = dictionaryMatrix[chosenLang]?.block || dictionaryMatrix[basePrefix]?.block || dictionaryMatrix["en"].block;
                    alert(blockMsg); toggleSidebar(); return;
                }
            }

            const chatBox = document.getElementById("chatBox");
            // Render user attachments fluidly inside structural layouts
            chatBox.innerHTML += `<div class="message user-msg">${text}${activeBase64Image ? '<br><img src="'+activeBase64Image+'" class="chat-img-render">' : ''}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
            
            // Toggle processing submission states to block double submit events
            document.getElementById("btnSubmitAction").disabled = true;

            fetch('/ask', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text, model: document.getElementById("modelSelect").value, image_data: activeBase64Image })
            })
            .then(r => r.json()).then(data => {
                document.getElementById("btnSubmitAction").disabled = false;
                const msg = document.createElement("div");
                msg.className = "message dex-msg";
                msg.innerHTML = data.dex_says.includes("<img") ? data.dex_says : marked.parse(data.dex_says);
                chatBox.appendChild(msg);
                msg.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
                chatBox.scrollTop = chatBox.scrollHeight;

                if(document.getElementById("voiceOutputToggle").checked && localSpeechVoices.length > 0) {
                    const utterance = new SpeechSynthesisUtterance(data.dex_says.replace(/<\/?[^>]+(>|$)/g, ""));
                    utterance.voice = localSpeechVoices[document.getElementById("voiceEngineDropdown").value];
                    window.speechSynthesis.speak(utterance);
                }
                updateSidebarLogs();
            }).catch(() => { document.getElementById("btnSubmitAction").disabled = false; });
            
            inputField.value = ""; clearImageAttachment();
        }

        function loadVoices() {
            localSpeechVoices = window.speechSynthesis.getVoices();
            const dropdown = document.getElementById("voiceEngineDropdown");
            if(dropdown && localSpeechVoices.length) {
                dropdown.innerHTML = localSpeechVoices.map((v, i) => `<option value="${i}">${v.name} [${v.lang}]</option>`).join('');
                const currentLang = document.getElementById("cfgLanguage").value || "en";
                syncVoiceEngineDropdownWithLanguageSelection(currentLang);
            }
        }

        window.onload = initializeSessionState;
    </script>
</body>
